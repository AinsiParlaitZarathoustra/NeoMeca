name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag CalVer cible (ex. 2026.11.22 ou 2026.11.22-2150)"
        required: false
        type: string
      draft:
        description: "Créer en brouillon (draft)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].*"
      - "v[0-9][0-9][0-9][0-9].*"

permissions:
  contents: write

jobs:
  verify:
    name: Contrôles et tests avant publication
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            ffmpeg

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Installer cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérifier TypeScript, tests unitaires et build frontend
        run: |
          npm run check
          npm run test:types
          npm run test:unit
          npm run build

      - name: Vérifier Rust (check, clippy, nextest)
        working-directory: src-tauri
        run: |
          cargo check
          cargo clippy --all-targets -- -D warnings -A linker_messages
          cargo nextest run --workspace

  build-windows:
    name: Build Windows (NSIS, MSI, ZIP)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler les paquets Windows (nsis, msi)
        run: npx tauri build --bundles nsis,msi

      - name: Préparer les livrables Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          node scripts/package-portable.mjs --platform windows --out-dir release-assets

      - name: Déposer les artefacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*

  build-linux:
    name: Build Linux (AppImage, DEB, ZIP)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            ffmpeg \
            zip

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler les paquets Linux (appimage, deb)
        run: npx tauri build --bundles appimage,deb

      - name: Préparer les livrables Linux
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          node scripts/package-portable.mjs --platform linux --out-dir release-assets

      - name: Déposer les artefacts Linux
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*

  publish-release:
    name: Publier la GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger tous les livrables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Déterminer le tag et les notes de version
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            TAG="$(date -u +%Y.%m.%d-%H%M)"
          fi

          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRAFT="$INPUT_DRAFT"
          else
            DRAFT="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

          sed 's/^          //' << 'EOF' > release-notes.md
          Voici la nouvelle version de NeoMeca, outil libre de pointage vidéo et d'analyse mécanique pour la physique-chimie.

          ## Fichiers disponibles

          - **Windows** : installeur `.setup.exe` (NSIS), paquet `.msi` (WiX) et archive portable `.zip`.
          - **Linux** : `.AppImage`, paquet `.deb` et archive portable `.zip`.

          ## Avertissement sur les binaires open source non signés

          Les binaires fournis sont compilés publiquement depuis le code source mais ne disposent pas encore de certificat de signature payant. Sous Windows, SmartScreen peut afficher un avertissement lors du premier lancement (`Informations complémentaires` puis `Exécuter quand même`). Sous Linux, rendez l'`.AppImage` exécutable (`chmod +x`) avant de le lancer.

          ## Méthodologie et vérifications de la publication automatique

          J'ai généré et vérifié automatiquement les 6 livrables desktop (Windows et Linux) à partir du dépôt via GitHub Actions, après exécution des contrôles TypeScript, Vite, Clippy et des suites de tests unitaires.
          EOF

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: NeoMeca ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: release-assets/*

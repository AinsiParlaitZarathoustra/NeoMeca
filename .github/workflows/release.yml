name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag CalVer cible (ex. 2026.11.23)"
        required: false
        default: "2026.11.23"
        type: string
      draft:
        description: "Créer en brouillon (draft)"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].*"

permissions:
  contents: read

jobs:
  verify:
    name: Contrôles et tests
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            ffmpeg

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Installer cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Vérifier syntaxe du script FFmpeg et frontend
        run: |
          bash -n scripts/build-ffmpeg-minimal.sh
          npm run check
          npm run test:types
          npm run test:unit
          npm run build

      - name: Vérifier Rust
        working-directory: src-tauri
        run: |
          cargo check
          cargo clippy --all-targets -- -D warnings -A linker_messages
          cargo nextest run --workspace

  build-windows:
    name: Build Windows (setup.exe, msi, zip)
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Cache FFmpeg minimal LGPL (Windows)
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/bin
          key: ffmpeg-minimal-win64-${{ hashFiles('scripts/build-ffmpeg-minimal.sh') }}

      - name: Configurer MSYS2 / MinGW-w64 (en cas de cache manquant)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-nasm
            make
            tar
            xz
            curl

      - name: Compiler FFmpeg et FFprobe minimaux LGPL (Windows)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          bash scripts/build-ffmpeg-minimal.sh --target windows --output-dir src-tauri/bin

      - name: Vérifier la licence LGPL, les codecs et la taille FFmpeg (Windows)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ffmpeg = "src-tauri/bin/ffmpeg.exe"
          $ffprobe = "src-tauri/bin/ffprobe.exe"
          if (-not (Test-Path $ffmpeg) -or -not (Test-Path $ffprobe)) {
            throw "Binaires FFmpeg / FFprobe manquants dans src-tauri/bin/"
          }
          $ver = (& $ffmpeg -version | Out-String)
          if ($ver -notmatch '--disable-gpl' -or $ver -notmatch '--disable-nonfree') {
            throw "Le binaire ffmpeg.exe n'est pas compilé avec --disable-gpl --disable-nonfree."
          }
          & $ffmpeg -L | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Échec de ffmpeg.exe -L." }
          $decoders = (& $ffmpeg -decoders | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Échec de ffmpeg.exe -decoders." }
          foreach ($codec in @('h264', 'hevc', 'mpeg4', 'mjpeg', 'vp8', 'vp9', 'av1', 'indeo3', 'cinepak', 'msvideo1')) {
            if ($decoders -notmatch "\b$codec\b") {
              throw "Décodeur attendu absent dans ffmpeg.exe : $codec"
            }
          }
          & $ffprobe -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Échec de ffprobe.exe -version." }
          $totalBytes = (Get-Item $ffmpeg).Length + (Get-Item $ffprobe).Length
          Write-Output "Taille combinée FFmpeg + FFprobe (Windows) : $totalBytes octets"

      - name: Compiler les paquets Windows
        run: npx tauri build --bundles nsis,msi

      - name: Préparer les livrables et calculer les SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          node scripts/package-portable.mjs --platform windows --out-dir release-assets --require-ffmpeg
          $lines = Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText("$PWD/release-assets/SHA256SUMS-windows.txt", $content, [System.Text.UTF8Encoding]::new($false))

      - name: Déposer les artefacts Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/*

  build-linux:
    name: Build Linux (AppImage, deb, zip)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les dépendances système Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            nasm \
            xz-utils \
            curl \
            zip

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurer Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Cache FFmpeg minimal LGPL (Linux)
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/bin
          key: ffmpeg-minimal-linux64-${{ hashFiles('scripts/build-ffmpeg-minimal.sh') }}

      - name: Compiler FFmpeg et FFprobe minimaux LGPL (Linux)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-ffmpeg-minimal.sh --target linux --output-dir src-tauri/bin

      - name: Vérifier la licence LGPL, les codecs et la taille FFmpeg (Linux)
        run: |
          test -x src-tauri/bin/ffmpeg
          test -x src-tauri/bin/ffprobe
          VER_OUT="$(./src-tauri/bin/ffmpeg -version)"
          echo "$VER_OUT" | grep -q -- "--disable-gpl"
          echo "$VER_OUT" | grep -q -- "--disable-nonfree"
          ./src-tauri/bin/ffmpeg -L >/dev/null
          DECODERS="$(./src-tauri/bin/ffmpeg -decoders)"
          for codec in h264 hevc mpeg4 mjpeg vp8 vp9 av1 indeo3 cinepak msvideo1; do
            echo "$DECODERS" | grep -qw "$codec"
          done
          ./src-tauri/bin/ffprobe -version >/dev/null
          TOTAL_BYTES=$(( $(wc -c < src-tauri/bin/ffmpeg) + $(wc -c < src-tauri/bin/ffprobe) ))
          echo "Taille combinée FFmpeg + FFprobe (Linux) : $TOTAL_BYTES octets"

      - name: Compiler les paquets Linux
        run: npx tauri build --bundles appimage,deb

      - name: Vérifier l'autonomie du paquet .deb (sans conflit /usr/bin/ffmpeg)
        run: |
          DEB_FILE="$(ls src-tauri/target/release/bundle/deb/*.deb | head -n 1)"
          DEB_CONTENTS="$(dpkg-deb -c "$DEB_FILE")"
          echo "$DEB_CONTENTS" | grep -q "bin/ffmpeg"
          echo "$DEB_CONTENTS" | grep -q "bin/ffprobe"
          echo "$DEB_CONTENTS" | grep -q "THIRD_PARTY_NOTICES.txt"
          if echo "$DEB_CONTENTS" | grep -Eq "/usr/bin/(ffmpeg|ffprobe)"; then
            echo "Erreur : le .deb ne doit pas écrire /usr/bin/ffmpeg ni /usr/bin/ffprobe" >&2
            exit 1
          fi

      - name: Tester les binaires minimaux sur .mp4, .mov, .avi et .webm (PATH isolé)
        run: |
          sudo apt-get install -y ffmpeg
          TMP_VIDEOS="$(mktemp -d)"
          /usr/bin/ffmpeg -y -f lavfi -i testsrc=duration=0.2:size=64x64:rate=25 -c:v libx264 -pix_fmt yuv420p "$TMP_VIDEOS/test.mp4"
          /usr/bin/ffmpeg -y -f lavfi -i testsrc=duration=0.2:size=64x64:rate=25 -c:v mpeg4 "$TMP_VIDEOS/test.mov"
          /usr/bin/ffmpeg -y -f lavfi -i testsrc=duration=0.2:size=64x64:rate=25 -c:v msvideo1 "$TMP_VIDEOS/test.avi"
          /usr/bin/ffmpeg -y -f lavfi -i testsrc=duration=0.2:size=64x64:rate=25 -c:v libvpx "$TMP_VIDEOS/test.webm"
          for clip in "$TMP_VIDEOS"/test.*; do
            rm -f "$TMP_VIDEOS"/out_*.jpg
            env -i PATH="/nonexistent" "$PWD/src-tauri/bin/ffprobe" -v quiet -print_format json -show_format -show_streams "$clip" > /dev/null
            env -i PATH="/nonexistent" "$PWD/src-tauri/bin/ffmpeg" -y -v error -i "$clip" -frames:v 1 -q:v 2 "$TMP_VIDEOS/out_%d.jpg"
            test -s "$TMP_VIDEOS/out_1.jpg"
          done
          rm -rf "$TMP_VIDEOS"

      - name: Préparer les livrables et calculer les SHA256
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          node scripts/package-portable.mjs --platform linux --out-dir release-assets --require-ffmpeg
          (cd release-assets && sha256sum * > SHA256SUMS-linux.txt)

      - name: Déposer les artefacts Linux
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/*

  publish-release:
    name: Vérifier SHA256 et publier la Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Télécharger tous les livrables
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Vérifier l'intégrité SHA256 des binaires
        run: |
          cd release-assets
          sed -i 's/\r$//' SHA256SUMS-windows.txt SHA256SUMS-linux.txt
          sha256sum -c SHA256SUMS-windows.txt
          sha256sum -c SHA256SUMS-linux.txt
          cat SHA256SUMS-windows.txt SHA256SUMS-linux.txt > SHA256SUMS.txt
          rm -f SHA256SUMS-windows.txt SHA256SUMS-linux.txt

      - name: Déterminer le tag et les notes de version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG="$REF_NAME"
          else
            TAG="2026.11.23"
          fi

          if [[ "$TAG" == *-* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DRAFT="$INPUT_DRAFT"
          else
            DRAFT="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"

          sed 's/^          //' << 'EOF' > release-notes.md
          Voici la nouvelle version de NéoMeca, outil libre de pointage vidéo et d'analyse mécanique pour la physique-chimie.

          ## Fichiers disponibles

          - **Windows** : installeur `.setup.exe` (NSIS), paquet `.msi` (WiX) et archive portable `.zip`.
          - **Linux** : `.AppImage`, paquet `.deb` et archive portable `.zip`.
          - **Autonomie vidéo** : FFmpeg et FFprobe minimaux (licence LGPL v2.1+) sont intégrés nativement dans chaque paquet (voir `THIRD_PARTY_NOTICES.txt`).
          - **Intégrité** : le fichier `SHA256SUMS.txt` contient les empreintes SHA-256 vérifiées de tous les paquets.

          ## Avertissement sur les binaires open source non signés

          Les binaires fournis sont compilés publiquement depuis le code source mais ne disposent pas encore de certificat de signature payant. Sous Windows, SmartScreen peut afficher un avertissement lors du premier lancement (`Informations complémentaires` puis `Exécuter quand même`). Sous Linux, rendez l'`.AppImage` exécutable (`chmod +x`) avant de le lancer.

          ## Méthodologie et vérifications de la publication automatique

          J'ai généré, contrôlé par empreinte SHA-256 et vérifié automatiquement les 6 livrables desktop (Windows et Linux) via GitHub Actions, après exécution des tests TypeScript, Vite, Clippy et Rust.
          EOF

      - name: Créer la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: NeoMeca ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          draft: ${{ steps.meta.outputs.draft }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            release-assets/*
            THIRD_PARTY_NOTICES.txt
